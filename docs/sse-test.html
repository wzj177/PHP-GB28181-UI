<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSE 测试</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .form-group {
      margin: 10px 0;
    }
    label {
      display: inline-block;
      width: 100px;
    }
    input {
      width: 400px;
      padding: 5px;
    }
    button {
      padding: 8px 20px;
      margin: 10px 0;
      cursor: pointer;
    }
    #log {
      margin-top: 20px;
      padding: 10px;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 400px;
      overflow-y: auto;
      border-radius: 4px;
    }
    .log-line {
      margin: 2px 0;
      padding: 2px 5px;
    }
    .log-error { color: #f56c6c; }
    .log-success { color: #67c23a; }
    .log-info { color: #409eff; }
  </style>
</head>
<body>
  <h1>SSE 测试工具</h1>

  <div class="form-group">
    <label>URL:</label>
    <input type="text" id="url" value="http://127.0.0.1:8787/api/admin/gb28181/devices/17/event-stream?date=20260118&token=YOUR_TOKEN_HERE">
  </div>

  <button onclick="start()">开始连接</button>
  <button onclick="stop()">停止</button>
  <button onclick="clearLog()">清空日志</button>

  <div id="log"></div>

  <script>
    let eventSource = null;

    function log(msg, type = '') {
      const logDiv = document.getElementById('log');
      const line = document.createElement('div');
      line.className = 'log-line ' + type;
      const time = new Date().toTimeString().split(' ')[0];
      line.textContent = '[' + time + '] ' + msg;
      logDiv.appendChild(line);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function start() {
      const url = document.getElementById('url').value;
      log('开始连接: ' + url, 'log-info');

      if (eventSource) {
        eventSource.close();
      }

      try {
        eventSource = new EventSource(url);

        eventSource.onopen = function() {
          log('连接成功', 'log-success');
        };

        eventSource.onmessage = function(event) {
          log('收到消息: ' + event.data);
          try {
            const data = JSON.parse(event.data);
            console.log('解析后的数据:', data);
          } catch(e) {}
        };

        eventSource.addEventListener('end', function(event) {
          log('收到结束事件: ' + event.data, 'log-success');
        });

        eventSource.addEventListener('error', function(event) {
          log('服务器错误: ' + event.data, 'log-error');
        });

        eventSource.onerror = function(err) {
          log('连接错误, readyState: ' + eventSource.readyState, 'log-error');
          if (eventSource.readyState === 2) {
            log('连接已关闭', 'log-error');
            stop();
          }
        };
      } catch(e) {
        log('创建连接失败: ' + e.message, 'log-error');
      }
    }

    function stop() {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
        log('已停止连接', 'log-info');
      }
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }
  </script>
</body>
</html>
